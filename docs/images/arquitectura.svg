<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura modular de HistoVision</title>
<desc id="desc">La interfaz envía la imagen y el tipo tumoral al motor Python ejecutado por Pyodide en un Web Worker. El selector escoge uno de siete pipelines con una interfaz común. Las máscaras alimentan el módulo morfométrico compartido y la visualización de resultados. La trazabilidad observa el motor y entrega los resultados intermedios al explorador. GitHub Pages sirve los recursos estáticos.</desc>
